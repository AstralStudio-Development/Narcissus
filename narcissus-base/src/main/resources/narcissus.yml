# Narcissus Limbo Server Configuration
# config-version: 5

config-version: 5

settings:
  # Default language file to use (must match a file in the languages/ folder without extension)
  default_language: zh_CN
  # Port the embedded Narcissus limbo server listens on (loopback only)
  port: 65530
  # Bind address — keep as loopback; BungeeCord and Narcissus run on the same host
  bind_address: 127.0.0.1
  # Path to the schematic file (relative to plugin data folder)
  schematic_file: world.schematic
  # Max player slots (-1 = unlimited)
  max_slots: -1
  # Allowed native client protocols. Missing uses the same defaults below.
  # Existing explicit lists are preserved; add new protocols to allow upgrades.
  allow-version:
    - 47   # 1.8.x
    - 774  # 1.21.11 (not 1.21.4)
    - 775  # 26.1 / 26.1.1 / 26.1.2
    - 776  # 26.2
    - 777  # 26.3
  # BungeeCord server ID used by /lobby to leave Limbo.
  # The legacy key login_target_server is still accepted when this is absent.
  lobby_server: lobby
  # Dimension: 0=overworld, -1=nether, 1=end
  dimension: 1
  # Gamemode: 0=survival, 1=creative, 2=adventure, 3=spectator
  gamemode: 2
  # Spawn coordinates
  spawn:
    x: 0.5
    y: 64.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0
