// narcissus-bootstrap: BungeeCord plugin that embeds the Narcissus limbo core

dependencies {
    // Pull in narcissus-base classes (merged into the plugin fat jar).
    implementation project(':narcissus-base')

    // BungeeCord plugin API — compileOnly; provided by the proxy at runtime.
    compileOnly "net.md-5:bungeecord-api:${project.property('bungeecordApiVersion')}"

    // SnakeYAML for reading narcissus.yml — compileOnly; BungeeCord ships it at runtime.
    compileOnly 'org.yaml:snakeyaml:2.0'
    testImplementation 'org.yaml:snakeyaml:2.0'
}

jar {
    archiveBaseName   = 'narcissus-bootstrap'
    archiveClassifier = ''
    archiveVersion    = project.version

    // Fat jar: merge narcissus-base classes/resources; Bungee/SnakeYAML are
    // compileOnly and therefore never bundled.
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes 'Implementation-Title': 'Narcissus',
                   'Implementation-Version': project.version
    }
}
